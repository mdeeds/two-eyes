<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized Halloween Eyes</title>
    <link rel="stylesheet" href="./style.css">
    <!-- PeerJS for WebRTC Synchronization -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="eyeCanvas"></canvas>

    <div id="ui-panel" class="ui-overlay">
        <div class="panel-content">
            <h2>Eye Controller (<span id="role-label">Master</span>)</h2>
            
            <div id="share-container" style="display: none;">
                <p>Share this link on the 2nd display to sync the Right Eye:</p>
                <input type="text" id="share-url" readonly />
            </div>
            
            <div class="controls">
                <label>Zoom / Size:</label>
                <button id="btn-zoom-out" title="Decrease Size">-</button>
                <button id="btn-zoom-in" title="Increase Size">+</button>
            </div>
            
            <div id="expressionLabel" class="status-label">Loading...</div>
        </div>
    </div>
    
    <!-- Using standard ES Modules as requested -->
    <script type="module" src="./app.js"></script>
</body>
</html>
